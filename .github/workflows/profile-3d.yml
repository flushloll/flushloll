name: Refresh GitHub activity overview

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_activity.py"
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity-overview
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Render light and dark activity overview
        run: python3 scripts/render_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Commit and push updated activity graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/contributions/activity-light.svg assets/contributions/activity-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub activity overview"
            git push
          else
            echo "Activity graphics are already up to date."
          fi
